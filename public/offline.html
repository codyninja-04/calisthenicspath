<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F172A" />
    <title>Offline · CalisthenicsPath</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #f1f5f9; font-family: system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; text-align: center; }
      img { width: 56px; height: 56px; }
      h1 { font-size: 22px; margin: 20px 0 8px; text-transform: uppercase; letter-spacing: 0.02em; }
      p { color: #94a3b8; line-height: 1.6; margin: 0 0 24px; }
      button { background: #f97316; color: #1a0e05; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 600; font-size: 14px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>No signal</h1>
      <p>You're offline. Finish the set, remember the number, and log it when you're back on.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
